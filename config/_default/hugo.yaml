title: Statistical Data Science Lab
baseURL: https://statds.kaist.ac.kr/
defaultContentLanguage: en
locale: en-US
enableRobotsTXT: true
disableKinds: [taxonomy, term, RSS]
outputs:
  home: [HTML]
  section: [HTML]
imaging:
  resampleFilter: lanczos
  anchor: smart
  jpeg:
    quality: 80
  webp:
    quality: 80
caches:
  images:
    dir: ':cacheDir/images'
  assets:
    dir: ':cacheDir/assets'
mediaTypes:
  application/yaml:
    suffixes: [yml]
outputFormats:
  cms_config:
    baseName: config
    isPlainText: true
    mediaType: application/yaml
    notAlternative: false
