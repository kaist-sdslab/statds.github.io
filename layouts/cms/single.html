<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Content Manager · SDS Lab</title>
  {{ $tagsStyle := resources.Get "css/cms-tags.css" | minify | fingerprint }}
  <link rel="stylesheet" href="{{ $tagsStyle.RelPermalink }}" integrity="{{ $tagsStyle.Data.Integrity }}">
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>
  <script>window.CMS_MANUAL_INIT = true;</script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  {{ $catalog := partialCached "publications/topic-catalog.html" site }}
  <script id="publication-tag-catalog" type="application/json">{{ $catalog.topics | jsonify | safeJS }}</script>
  {{ $tagsScript := resources.Get "js/cms-tags.js" | minify | fingerprint }}
  <script src="{{ $tagsScript.RelPermalink }}" integrity="{{ $tagsScript.Data.Integrity }}"></script>
</body>
</html>
