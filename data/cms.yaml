backend:
  name: github
  repo: TaeW00kKim/statds.github.io
  branch: main
  base_url: https://sds-cms-auth.xodnr35.workers.dev
  auth_endpoint: auth
  squash_merges: true
media_folder: assets/media/research
public_folder: media/research
collections:
- name: pages
  label: Pages
  editor:
    preview: true
    visualEditing: true
  files:
  - name: home
    label: Home
    file: content/_index.md
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - label: Introduction
      name: hero
      widget: object
      fields:
      - label: Welcome
        name: welcome
        widget: string
      - label: Description
        name: description
        widget: text
    - label: Research Areas
      name: research
      widget: list
      fields:
      - label: Title
        name: title
        widget: string
      - label: Description
        name: description
        widget: text
      - label: Accent color
        name: color
        widget: color
        allowInput: true
        pattern:
        - ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
        - 'Enter a HEX color such as #285c9b.'
        default: '#285c9b'
        hint: Color of this research title and related-publications link.
      - label: Related publication topics
        name: publication_topics
        widget: publication-tags
        allow_create: false
        required: false
        hint: Choose from Topics shown in Publications filters. Removed topics are excluded from Home automatically.
        topic_scope: filters
      - label: Image
        name: image
        widget: image
        media_library:
          allow_multiple: false
      - label: Image description
        name: image_alt
        widget: string
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - label: Research heading
        name: research_heading
        widget: string
      - label: Related publications
        name: related_publications
        widget: string
  - name: professors
    label: Professor
    file: content/professors/index.md
    media_folder: ../../assets/media/people
    public_folder: media/people
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - name: layout
      widget: hidden
      default: professors
    - label: Name
      name: name
      widget: string
    - label: Photo
      name: photo
      widget: image
      media_library:
        allow_multiple: false
    - label: Photo frame
      name: photo_frame
      widget: portrait-frame
      aspect_ratio: original
      required: false
      default:
        position_x: 50
        position_y: 50
        zoom: 1
    - label: Photo description
      name: photo_alt
      widget: string
    - label: Institution
      name: institution
      widget: string
    - label: Positions
      name: roles
      widget: list
      fields:
      - label: Title
        name: title
        widget: string
      - label: Department
        name: department
        widget: string
    - label: Email
      name: email
      widget: string
    - label: Office
      name: office
      widget: string
    - label: Research Interests
      name: research_interests
      widget: list
      fields:
      - label: Main topic
        name: title
        widget: string
      - label: Details
        name: detail
        widget: text
        required: false
    - label: Education
      name: education
      widget: list
      fields:
      - label: Degree
        name: degree
        widget: string
      - label: Department
        name: department
        widget: string
      - label: Institution
        name: institution
        widget: string
    - label: Professional Experience
      name: experience
      widget: list
      fields:
      - label: Role
        name: role
        widget: string
      - label: Institution
        name: institution
        widget: string
      - label: Period
        name: period
        widget: string
    - label: Editorial Service
      name: editorial_service
      widget: list
      fields:
      - label: Role
        name: role
        widget: string
      - label: Journal
        name: journal
        widget: string
      - label: Period
        name: period
        widget: string
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - label: Email
        name: email
        widget: string
      - label: Office
        name: office
        widget: string
      - label: Interests
        name: interests
        widget: string
      - label: Education
        name: education
        widget: string
      - label: Experience
        name: experience
        widget: string
      - label: Editorial
        name: editorial
        widget: string
  - name: publications
    label: Publications
    file: content/publications/_index.md
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - name: layout
      widget: hidden
      default: publications
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - label: Search
        name: search
        widget: string
      - label: Search placeholder
        name: search_placeholder
        widget: string
      - label: Type
        name: type
        widget: string
      - label: Year
        name: year
        widget: string
      - label: Topic
        name: topic
        widget: string
      - label: All
        name: all
        widget: string
      - label: Journal filter
        name: journal_filter
        widget: string
      - label: Conference filter
        name: conference_filter
        widget: string
      - label: Journal label
        name: journal_label
        widget: string
      - label: Conference label
        name: conference_label
        widget: string
      - label: Reset
        name: reset
        widget: string
      - label: Sort
        name: sort
        widget: string
      - label: Newest
        name: newest
        widget: string
      - label: Oldest
        name: oldest
        widget: string
      - label: Title sort
        name: title_sort
        widget: string
      - label: Empty title
        name: empty_title
        widget: string
      - label: Empty text
        name: empty_text
        widget: string
      - label: No script
        name: no_script
        widget: string
      - label: Previous
        name: previous
        widget: string
      - label: Next
        name: next
        widget: string
      - label: Page label
        name: page_label
        widget: string
        hint: Keep placeholders such as {start}, {end}, {total}, and {page} unchanged.
      - label: Count
        name: count
        widget: string
        hint: Keep placeholders such as {start}, {end}, {total}, and {page} unchanged.
      - label: Empty count
        name: empty_count
        widget: string
      - label: Singular result name
        name: singular
        widget: string
      - label: Plural result name
        name: plural
        widget: string
      - label: Total suffix
        name: total_suffix
        widget: string
        hint: Keep placeholders such as {start}, {end}, {total}, and {page} unchanged.
      - label: Back
        name: back
        widget: string
      - label: Page size
        name: page_size
        widget: number
        value_type: int
        min: 1
        max: 100
  - name: people
    label: People
    file: content/people/index.md
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - name: layout
      widget: hidden
      default: people
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - label: Members tab
        name: members_tab
        widget: string
      - label: Interns tab
        name: interns_tab
        widget: string
      - label: Alumni tab
        name: alumni_tab
        widget: string
      - label: Phd heading
        name: phd_heading
        widget: string
      - label: Masters heading
        name: masters_heading
        widget: string
      - label: Interns heading
        name: interns_heading
        widget: string
      - label: Alumni heading
        name: alumni_heading
        widget: string
      - label: Research interests
        name: research_interests
        widget: string
      - label: Empty
        name: empty
        widget: string
  - name: software
    label: Softwares
    file: content/software/index.md
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - name: layout
      widget: hidden
      default: resources
    - name: resource_type
      widget: hidden
      default: software
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - &id001
        label: Empty
        name: empty
        widget: string
  - name: courses
    label: Courses
    file: content/courses/index.md
    fields:
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: text
    - name: layout
      widget: hidden
      default: resources
    - name: resource_type
      widget: hidden
      default: courses
    - label: Page Labels
      name: labels
      widget: object
      collapsed: true
      fields:
      - label: Offered
        name: offered
        widget: string
      - *id001
  - name: not_found
    label: Not Found
    file: content/not-found/index.md
    fields:
    - name: headless
      widget: hidden
      default: true
    - label: Title
      name: title
      widget: string
    - label: Description
      name: description
      widget: string
    - label: Back
      name: back
      widget: string
- name: papers
  label: Publications
  label_singular: Publication
  folder: content/publications
  create: true
  slug: '{{slug}}'
  summary: '{{title}} ({{fields.year}})'
  filter:
    field: layout
    value: publication
  sortable_fields:
  - field: year
    label: Year
    default_sort: desc
  - month
  - title
  editor:
    preview: true
    visualEditing: true
  fields:
  - label: Title
    name: title
    widget: string
  - name: layout
    widget: hidden
    default: publication
  - label: Authors (in order)
    name: authors
    widget: list
    min: 1
    field:
      label: Author
      name: author
      widget: string
    hint: Add one author per item. Names may contain commas; drag items to preserve author order.
    summary: '{{fields.author}}'
  - label: Type
    name: publication_type
    widget: select
    options:
    - label: Journal article
      value: journal
    - label: Conference paper
      value: conference
  - label: Year
    name: year
    widget: number
    value_type: int
    min: 1900
    hint: Year displayed in the publication list.
  - label: Publication month
    name: month
    widget: number
    value_type: int
    required: false
    min: 1
    max: 12
    hint: Optional sorting information within the same year. Only the year is shown on the website. Leave empty if unknown.
  - label: Journal / Conference
    name: venue
    widget: string
  - label: Volume / Issue / Pages / Notes
    name: venue_details
    widget: string
    required: false
  - label: Topics
    name: topics
    widget: publication-tags
    allow_create: true
    hint: Search existing tags, or type a new tag and press Enter. New tags become reusable when this paper is saved.
  - label: Paper URL
    name: url_paper
    widget: string
    required: false
    hint: Optional. Clicking the publication title opens this URL. Without a URL, the title is plain text.
  - label: GitHub URL
    name: url_code
    widget: string
    required: false
    hint: Optional repository URL. The GitHub button is shown only when this URL is filled in.
- name: people
  label: People
  label_singular: Person
  folder: data/people
  extension: yaml
  format: yaml
  identifier_field: name
  slug: '{{slug}}'
  create: true
  summary: '{{name}} · {{group}}'
  sortable_fields:
  - field: group
    label: Group
    default_sort: desc
  - order
  - name
  - field: internship.start_date
    label: Internship start date
  - field: internship.end_date
    label: Internship end date
  - field: alumni.graduation_year
    label: Graduation year
  view_filters:
  - label: Ph.D. Students
    field: group
    pattern: ^phd$
  - label: M.S. Students
    field: group
    pattern: ^masters$
  - label: Interns
    field: group
    pattern: ^intern$
  - label: Alumni
    field: group
    pattern: ^alumni$
  media_folder: ../../assets/media/people
  public_folder: media/people
  editor:
    preview: true
    visualEditing: true
  fields:
  - label: Name
    name: name
    widget: string
  - label: Group
    name: group
    widget: people-group
    options:
    - label: Ph.D. Student
      value: phd
    - label: M.S. Student
      value: masters
    - label: Intern
      value: intern
    - label: Alumni
      value: alumni
    hint: Change the group to move a profile between sections. The form shows the fields for the selected group. Existing
      values are preserved when switching groups.
  - label: Members display order
    name: order
    widget: people-conditional
    control_widget: number
    groups:
    - phd
    - masters
    required: false
    value_type: int
    default: 10
    min: 0
    hint: Smaller numbers appear first within the selected member group.
  - label: Member note
    name: member_note
    widget: people-conditional
    control_widget: string
    groups:
    - phd
    - masters
    required: false
    hint: Optional text shown below the name without a label, e.g. Co-advising.
  - label: Affiliation
    name: affiliation
    widget: people-conditional
    control_widget: string
    groups:
    - phd
    - masters
    - intern
    required: false
    hint: Department or school shown below the name.
  - label: Photo
    name: photo
    widget: people-conditional
    control_widget: image
    groups:
    - phd
    - masters
    media_library:
      allow_multiple: false
    required: false
    hint: Without a photo, an initials placeholder is shown.
  - label: Photo frame
    name: photo_frame
    widget: people-conditional
    control_widget: portrait-frame
    groups:
    - phd
    - masters
    required: false
    default:
      position_x: 50
      position_y: 50
      zoom: 1
    hint: Drag and zoom to choose the visible area. The original photo is preserved.
  - label: Research interests
    name: research_interests
    widget: people-conditional
    control_widget: list
    groups:
    - phd
    - masters
    required: false
    default: []
    hint: Add interests as separate items. They are independent of publication tags.
  - label: Email
    name: email
    widget: people-conditional
    control_widget: string
    groups:
    - phd
    - masters
    required: false
  - label: Internship details
    name: internship
    widget: people-conditional
    control_widget: object
    groups:
    - intern
    required: false
    collapsed: false
    hint: Newer start dates appear first. Choose Year only if the exact date is unknown. Leave an end date empty while the
      internship is ongoing.
    fields:
    - label: Program
      name: program
      widget: string
      required: false
    - label: Start date
      name: start_date
      widget: people-date
    - label: End date
      name: end_date
      widget: people-date
      required: false
      hint: Leave empty for an ongoing internship. Choose Year only when the exact date is unknown.
  - label: Alumni details
    name: alumni
    widget: people-conditional
    control_widget: object
    groups:
    - alumni
    required: false
    collapsed: false
    hint: Alumni are sorted by graduation year, newest first.
    fields:
    - label: Degree / Former role
      name: degree
      widget: select
      required: false
      options:
      - Ph.D.
      - M.S.
      - B.S.
      - Research intern
      - Other
    - label: Graduation / Completion year
      name: graduation_year
      widget: number
      value_type: int
      required: false
      min: 1900
      max: 2100
    - label: Thesis / Dissertation title
      name: thesis
      widget: text
      required: false
    - label: Current / Next position
      name: position
      widget: string
      required: false
- name: software
  label: Softwares
  label_singular: Software entry
  folder: data/software
  extension: yaml
  format: yaml
  create: true
  slug: '{{slug}}'
  summary: '{{title}}'
  sortable_fields:
  - field: order
    label: Display Order
    default_sort: asc
  - title
  editor:
    preview: true
    visualEditing: true
  fields:
  - label: Name
    name: title
    widget: string
  - label: Description
    name: description
    widget: text
    required: false
  - label: GitHub URL
    name: github
    widget: string
    required: false
  - label: Display order
    name: order
    widget: number
    value_type: int
    min: 0
    default: 10
- name: courses
  label: Courses
  label_singular: Course
  folder: data/courses
  extension: yaml
  format: yaml
  create: true
  slug: '{{slug}}'
  summary: '{{code}} · {{title}}'
  sortable_fields:
  - field: order
    label: Display Order
    default_sort: asc
  - title
  - code
  editor:
    preview: true
    visualEditing: true
  fields:
  - label: Course title
    name: title
    widget: string
  - label: Course code
    name: code
    widget: string
    required: false
  - label: Teaching terms
    name: terms
    widget: list
    required: false
    default: []
    field:
      label: Term
      name: term
      widget: string
    hint: Add each offering separately, for example Fall 2026 and Fall 2025. Displayed below the course title in the order
      entered.
  - label: Display order
    name: order
    widget: number
    value_type: int
    min: 0
    default: 10
- name: settings
  label: Site Settings
  editor:
    preview: true
    visualEditing: true
  files:
  - name: site_settings
    label: General & Navigation
    file: data/site_settings.yaml
    fields:
    - label: Header and footer
      name: site
      widget: object
      collapsed: true
      fields:
      - label: Logo
        name: logo
        widget: string
      - label: Name
        name: name
        widget: string
      - label: Institution
        name: institution
        widget: string
      - label: Copyright
        name: copyright
        widget: string
      - label: Title suffix
        name: title_suffix
        widget: string
      - label: Home title suffix
        name: home_title_suffix
        widget: string
      - label: Skip link
        name: skip_link
        widget: string
    - label: Link labels and unavailable states
      name: links
      widget: object
      collapsed: true
      fields:
      - label: Github title
        name: github_title
        widget: string
      - label: No github
        name: no_github
        widget: string
    - label: Footer
      name: contact
      widget: object
      fields:
      - label: Lab name
        name: title
        widget: string
      - label: Address
        name: address
        widget: text
    - label: Navigation
      name: navigation
      widget: list
      summary: '{{name}}'
      fields:
      - label: Label
        name: name
        widget: string
      - label: Page path
        name: url
        widget: string
        required: false
        hint: Keep existing page paths unless you also move the page.
      - label: Display order
        name: weight
        widget: number
        value_type: int
      collapsed: true
  - name: publication_filters
    label: Publication Filter Display
    file: data/publication_filters.yaml
    fields:
    - label: Years shown in filters
      name: years
      widget: list
      required: false
      default: []
      field:
        label: Year
        name: year
        widget: number
        value_type: int
        min: 1900
        max: 2100
      hint: Only these years appear as filter buttons, newest first. Other publications remain searchable and visible under
        All. Leave empty to hide the Year row.
    - label: Topics shown in filters
      name: topics
      widget: publication-tags
      allow_create: false
      required: false
      default: []
      hint: Choose from the union of saved publication topics. Home research links can only select topics in this list.
  - name: topic_colors
    label: Topic Colors
    file: data/topic_colors.yaml
    fields:
    - label: Color assignments
      name: assignments
      widget: list
      required: false
      fields:
      - label: Topics
        name: topics
        widget: publication-tags
        allow_create: false
        hint: Choose saved publication tags to use this color. Unassigned tags use blue.
      - label: Color
        name: color
        widget: color
        allowInput: true
        pattern:
        - ^#([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$
        - 'Enter a HEX color such as #285c9b.'
        default: '#285c9b'
